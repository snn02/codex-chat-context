<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка привязки контекста</title><style>body{font:15px system-ui;background:var(--color-background-primary,#fff);color:var(--color-text-primary,#222);padding:24px;line-height:1.5}h1{font-size:23px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#8881;padding:14px;border-radius:8px}small{color:#777}</style>
<h1>Проверка панели контекста</h1><p id="status">Ожидание соединения с Codex…</p><p>Данные ниже получены от приложения. ID чата не задан в коде.</p><pre id="result"></pre><small>Временный прототип. Содержимое чатов не читается.</small>
<script>
const instance=crypto.randomUUID();let counter=0;const pending=new Map();
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++counter;pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');setTimeout(()=>{if(pending.delete(id))reject(Error('Host did not respond: '+method))},12000)})}
function ids(obj,prefix='',out={}){if(!obj||typeof obj!=='object')return out;for(const[k,v]of Object.entries(obj)){if(/secret|token|authorization|cookie/i.test(k))continue;const p=prefix?prefix+'.'+k:k;if(/thread|conversation|session|hostId|displayMode|version/i.test(k)&&['string','number'].includes(typeof v))out[p]=v;else if(v&&typeof v==='object')ids(v,p,out)}return out}
const result={instance,host:null,tool:null};function draw(){document.querySelector('#result').textContent=JSON.stringify(result,null,2)}
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}else if(m.method==='ui/notifications/tool-result'){result.tool=m.params?.structuredContent;draw()}else if(m.method==='ui/notifications/host-context-changed'){result.host={...result.host,...ids(m.params)};draw()}});
rpc('ui/initialize',{appInfo:{name:'Context binding probe',version:'0.1.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'}).then(async host=>{result.host=ids(host);result.hostKeys=Object.keys(host.hostContext||{});draw();parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');document.querySelector('#status').textContent='Панель подключена к приложению';await rpc('tools/call',{name:'report_binding',arguments:{report:{instance,...result.host}}})}).catch(e=>{document.querySelector('#status').textContent=e.message;draw()});draw();
</script></html>
